spring.application.name=mascotas-perdidas-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mascotas_perdidas}
spring.datasource.username=${DB_USERNAME:mascotas_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logback escribe en consola y archivo; las rutas son relativas a la raiz del proyecto.
logging.level.root=INFO
logging.level.mascotasperdidas=INFO
logging.file.name=logs/mascotas-perdidas.log
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.logback.rollingpolicy.file-name-pattern=logs/mascotas-perdidas.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true
